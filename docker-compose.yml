version: '3.8'

services:
  smartpark-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpark_ai_dashboard
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - LOG_LEVEL=INFO
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped
